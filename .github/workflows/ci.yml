name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12", "13"]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pdo_sqlite
          coverage: none
      - name: Install dependencies
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/database:^${{ matrix.laravel }}.0" "illuminate/console:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies
      - name: Validate package metadata
        run: composer validate --strict
      - name: Check code style
        run: composer lint
      - name: Run static analysis
        run: composer analyse
      - name: Run tests on SQLite
        run: composer test
      - name: Create isolated PostgreSQL test database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f tests/setup-postgres.sql
      - name: Run tests on PostgreSQL 18
        env:
          APPROVALS_TEST_PG: pgsql://noria_approvals_test:approvals_test_only@127.0.0.1:5432/noria_approvals_test
        run: composer test

  verify:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix check
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
