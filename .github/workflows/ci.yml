name: Verify and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify what changed
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for a pull request that already verified this tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          verified=false

          for head in $(gh api "repos/${REPO}/commits/${GITHUB_SHA}/pulls" --jq '.[] | select(.merged_at != null) | .head.sha'); do
            [ "$(gh api "repos/${REPO}/commits/${head}" --jq .commit.tree.sha)" = "$tree" ] || continue
            passed="$(gh api "repos/${REPO}/commits/${head}/check-runs?check_name=Verify%20what%20changed&filter=all" \
              --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
            if [ "$passed" -gt 0 ]; then
              echo "tree ${tree} passed verify on pull request head ${head}"
              verified=true
              break
            fi
          done

          echo "verified=${verified}" >> "${GITHUB_OUTPUT}"

      - name: Work out what changed
        id: scope
        env:
          VERIFIED: ${{ steps.reuse.outputs.verified }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          base="${BASE:-${BEFORE:-}}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed='EVERYTHING'
          else
            changed="$(git diff --name-only "$base" "${GITHUB_SHA}")"
          fi

          scope() {
            if [ "$changed" = 'EVERYTHING' ]; then
              echo true
              return
            fi
            if printf '%s\n' "$changed" | grep -qE "$1"; then echo true; else echo false; fi
          }

          php="$(scope '^(src/|config/|database/|tests/|composer\.json|phpstan\.neon|phpunit\.xml|pint\.json|\.gitattributes|\.github/)')"

          if [ "${VERIFIED:-false}" = true ]; then
            php=false
          fi

          echo "php=${php}" >> "${GITHUB_OUTPUT}"
          echo "changed scopes: php=${php}"

      - name: Set up PHP 8.5
        if: steps.scope.outputs.php == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Validate the Composer metadata
        if: steps.scope.outputs.php == 'true'
        run: composer validate --strict

      - name: Install Composer dependencies
        if: steps.scope.outputs.php == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check the code style
        if: steps.scope.outputs.php == 'true'
        run: vendor/bin/pint --test

      - name: Analyse the package statically
        if: steps.scope.outputs.php == 'true'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Check the package archive builds
        if: steps.scope.outputs.php == 'true'
        run: composer archive --format=zip --dir="${RUNNER_TEMP}"

  tag:
    name: Tag the release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    outputs:
      name: ${{ steps.tag.outputs.name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version bump and create tag
        id: tag
        run: |
          set -euo pipefail

          EXISTING=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)

          if [ -n "$EXISTING" ]; then
            echo "HEAD is already tagged $EXISTING; reusing it."
            echo "name=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          assert_version_unused() {
            TAG="$1"

            REMOTE_REF=$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR==1 {print $1}')

            if [ -n "$REMOTE_REF" ]; then
              REMOTE_COMMIT=$(git rev-parse "${REMOTE_REF}^{commit}" 2>/dev/null || echo "$REMOTE_REF")

              if [ "$REMOTE_COMMIT" = "$(git rev-parse HEAD)" ]; then
                echo "Tag ${TAG} already exists upstream at this commit; reusing it."
                echo "name=${TAG}" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "Refusing to move ${TAG}."
              echo "  upstream: ${REMOTE_COMMIT}"
              echo "  HEAD:     $(git rev-parse HEAD)"
              echo "Moving a published tag desynchronises Packagist from the repo."
              exit 1
            fi

            FEED=$(curl -fsS --max-time 15 \
              "https://repo.packagist.org/p2/norialabs/approvals.json" || true)

            if [ -z "$FEED" ]; then
              echo "Could not reach Packagist to confirm ${TAG} is unused; continuing."
              return 0
            fi

            if printf '%s' "$FEED" | grep -q "\"version\":\"${TAG}\""; then
              echo "Refusing to create ${TAG}: Packagist already published that version."
              echo "The tag was deleted but the version was not, so recreating it here"
              echo "would serve different content under a version already in the wild."
              echo "Delete the version on Packagist first, or bump past it."
              exit 1
            fi
          }

          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Ev '^v0\.0\.' | head -n1 || true)

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v${RELEASE_LINE}.0"
            echo "Latest release tag: none"
            echo "New tag: $NEW_TAG"

            assert_version_unused "$NEW_TAG"

            git tag "$NEW_TAG"
            git push origin "$NEW_TAG"
            echo "name=$NEW_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Latest release tag: $LATEST_TAG"

          LATEST_LINE="${LATEST_TAG#v}"
          LATEST_LINE="${LATEST_LINE%.*}"

          if [ "$LATEST_LINE" = "$RELEASE_LINE" ]; then
            NEW_TAG="v${RELEASE_LINE}.$(( ${LATEST_TAG##*.} + 1 ))"
            echo "Bump: patch"
          elif [ "$(printf '%s\n' "$LATEST_LINE" "$RELEASE_LINE" | sort -V | head -n1)" = "$LATEST_LINE" ]; then
            NEW_TAG="v${RELEASE_LINE}.0"
            echo "Bump: start the ${RELEASE_LINE} line"
          else
            echo "Refusing to release ${RELEASE_LINE}.x behind ${LATEST_TAG}. Raise RELEASE_LINE."
            exit 1
          fi
          echo "New tag: $NEW_TAG"

          assert_version_unused "$NEW_TAG"

          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
          echo "name=$NEW_TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_LINE: "0.1"

  release:
    name: Publish the release
    needs: [verify, tag]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tag.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.tag.outputs.name }}
        run: |
          set -euo pipefail

          if [ -z "$TAG_NAME" ]; then
            echo "The tag job produced no tag name."
            exit 1
          fi

          for _ in $(seq 1 10); do
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release already exists for $TAG_NAME"
          else
            gh release create "$TAG_NAME" --generate-notes
          fi

      - name: Update Packagist
        continue-on-error: true
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PACKAGIST_TOKEN:-}" ]; then
            echo "No PACKAGIST_TOKEN here; leaving the update to the GitHub integration."
            exit 0
          fi

          curl -sS --fail-with-body -XPOST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=thekiharani&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://github.com/norialabs/approvals"}}'
