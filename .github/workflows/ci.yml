name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["11", "12", "13"]
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/database:^${{ matrix.laravel }}.0" --no-update --no-interaction
          composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies
      - name: Validate package metadata
        run: composer validate --strict
      - name: Check code style
        run: composer lint
      - name: Run static analysis
        run: composer analyse
      - name: Run tests
        run: composer test

  verify:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every matrix check
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
